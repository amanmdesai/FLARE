# ####################################################################
#
#   This yaml file is where you can add a N-stage MC production
#   procedure. Given the analyst has configured their workflow
#   as per the README. The workflow will then find the correct
#   type (e.g whizard) and use the correct CLI arguments in
#   the correct order etc.
#
#   For the sake of uniqueness, the use of brackets here is intended.
#   The < and > brackets indicate a name that can be whatever the
#   analyst wished. The ( ) brackets indicate an output name that
#   b2luigi will handle in the workflow.
#
#   When adding new 2-stage workflows keep this in mind
#
#      () - Output files that b2luigi will generate and handle
#      <> - free space that the analyst can use to detail a file
#      -- - The input from a previous stage
#      ++ - The datatype parameter given in the details.yaml
#
#   What this is allowing us to do is create a totally generic
#   workflow that can handle any combination of generators so long
#   as it can fit this template
#
#   Any given generator must follow this format
#
#    generator_name :
#         stage1:
#            cmd : cmd {0} {1}
#            args :
#               - arg1<>.root # will go in {0}
#               - ().root     # will go in {1}
#            output_file: output.root
#
#   Each stage MUST have a cmd, list of args and an outputfile. If required,
#   you can also define pre_run and on_completion lists that have the name
#   of a function to be run that is a
#
# ####################################################################

"$model": "MCProductionModel"

whizard :
  stage1 :
    cmd : whizard {0}
    args :
      - ++.sin
    output_file: proc.stdhep
  stage2:
    cmd : DelphesSTDHEP_EDM4HEP {0} {1} {2} {3}
    args:
      - card_<>.tcl
      - edm4hep_<>.tcl
      - ().root
      - --.stdhep
    output_file : $$.root

madgraph:
  stage1 :
    cmd : mg5_aMC {0}
    args :
      - ++_runcard.dat
    on_completion:
      - madgraph_move_contents_to_tmp_output
    output_file: signal.lhe
  stage2:
    cmd : DelphesPythia8_EDM4HEP {0} {1} {2} {3}
    args:
      - card_<>.tcl
      - edm4hep_<>.tcl
      - pythia_card_<>.cmd
      - ().root
    output_file : $$.root
    pre_run:
      - madgraph_copy_lhe_file_to_cwd

pythia8 :
  stage1:
    cmd : DelphesPythia8_EDM4HEP {0} {1} {2} {3}
    args:
      - card_<>.tcl
      - edm4hep_<>.tcl
      - ++.cmd
      - ().root
    output_file : $$.root

# pythia8_fullsim runs a full Geant4/DD4hep simulation (via ddsim) instead of the
# parameterised Delphes response used by "pythia8" above. It stops at the raw simulated-hit
# EDM4hep output; digitisation/reconstruction is not included (see README).
#
#   stage1: k4run_pythia8_<>.py is an analyst-supplied k4run/Gaudi steering script (based on
#           the key4hep k4Gen Pythia8 example) that generates Pythia8 events and writes them
#           to an EDM4hep ROOT file. The datatype's ++.cmd pythia8 card is passed via the
#           --Pythia8.PythiaInterface.pythiacard override (the instance names must match
#           those used in k4run_pythia8_<>.py).
#   stage2: ddsim runs the full Geant4 simulation over those generator-level events against
#           the card_<>.xml DD4hep detector model, using the ddsim_<>.py steering file.
pythia8_fullsim :
  stage1:
    cmd : k4run {0} -n -1 --Pythia8.PythiaInterface.pythiacard {1} --out.filename {2}
    args:
      - k4run_pythia8_<>.py
      - ++.cmd
      - ().root
    output_file: genevents.root
  stage2:
    cmd : ddsim -I {0} -N -1 -O {1} --compactFile $(readlink -f {2}) --steeringFile {3}
    args:
      - --
      - ().root
      - card_<>.xml
      - ddsim_<>.py
    output_file : $$.root
